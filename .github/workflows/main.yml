name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: grep -E "^e: |error:|Unresolved|What went wrong" -A1 build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: MAXFC-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
